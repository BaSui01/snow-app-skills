<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Workflow: grilling, plan-execute, diagnosing-bugs, handoff">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0e2433"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-back" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="50" y="44" font-size="12" letter-spacing="3" fill="#64748b">WORKFLOW</text>

    <g font-size="11" letter-spacing="2" fill="#64748b">
      <text x="160" y="64" text-anchor="middle">ALIGN</text>
      <text x="430" y="64" text-anchor="middle">BUILD</text>
      <text x="700" y="64" text-anchor="middle">FIX</text>
      <text x="970" y="64" text-anchor="middle">CONTINUE</text>
    </g>

    <g>
      <rect x="50" y="76" width="220" height="76" rx="14" fill="#0f2434" stroke="#1e4b63"/>
      <text x="160" y="108" text-anchor="middle" font-size="17" font-weight="600" fill="#e2e8f0">grilling</text>
      <text x="160" y="132" text-anchor="middle" font-size="12" fill="#7dd3fc">settle the decisions</text>

      <rect x="320" y="76" width="220" height="76" rx="14" fill="#0f2434" stroke="#1e4b63"/>
      <text x="430" y="108" text-anchor="middle" font-size="17" font-weight="600" fill="#e2e8f0">plan-execute</text>
      <text x="430" y="132" text-anchor="middle" font-size="12" fill="#7dd3fc">gated batches</text>

      <rect x="590" y="76" width="220" height="76" rx="14" fill="#0f2434" stroke="#1e4b63"/>
      <text x="700" y="108" text-anchor="middle" font-size="17" font-weight="600" fill="#e2e8f0">diagnosing-bugs</text>
      <text x="700" y="132" text-anchor="middle" font-size="12" fill="#7dd3fc">root cause first</text>

      <rect x="860" y="76" width="220" height="76" rx="14" fill="#0f2434" stroke="#1e4b63"/>
      <text x="970" y="108" text-anchor="middle" font-size="17" font-weight="600" fill="#e2e8f0">handoff</text>
      <text x="970" y="132" text-anchor="middle" font-size="12" fill="#7dd3fc">continue later</text>
    </g>

    <g stroke="#38bdf8" stroke-width="2" fill="none">
      <line x1="270" y1="114" x2="312" y2="114" marker-end="url(#arrow)"/>
      <line x1="540" y1="114" x2="582" y2="114" marker-end="url(#arrow)"/>
      <line x1="810" y1="114" x2="852" y2="114" marker-end="url(#arrow)"/>
    </g>

    <path d="M700 152 L700 206 L430 206 L430 160" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-back)"/>
    <text x="565" y="228" text-anchor="middle" font-size="12" fill="#a78bfa">retry after a verified fix</text>
  </g>
</svg>
